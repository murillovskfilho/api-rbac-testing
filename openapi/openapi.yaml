openapi: 3.0.3
info:
  title: Billing API
  version: 1.0.0
  description: >
    Multi-tenant invoices with Auth0-style RBAC. Every schema is closed
    (additionalProperties: false), so a response that leaks an internal field breaks the contract.
servers:
  - url: http://localhost:4000
security:
  - bearerAuth: []

paths:
  /v1/invoices:
    get:
      summary: List the caller's invoices
      parameters:
        - { in: query, name: status, schema: { type: string, enum: [open, paid, void] } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { in: query, name: offset, schema: { type: integer, minimum: 0, default: 0 } }
        - $ref: '#/components/parameters/ActAsTenant'
      responses:
        '200':
          description: A page of invoices
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvoicePage' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    post:
      summary: Create an invoice (requires write:invoices)
      parameters:
        - in: header
          name: Idempotency-Key
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoiceCreate' }
      responses:
        '201':
          description: Created (or replayed, with Idempotent-Replayed true)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '422': { $ref: '#/components/responses/Problem' }

  /v1/invoices/{id}:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    get:
      summary: Get one invoice
      parameters:
        - $ref: '#/components/parameters/ActAsTenant'
      responses:
        '200':
          description: The invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Change an open invoice (requires write:invoices)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InvoicePatch' }
      responses:
        '200':
          description: The updated invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/invoices/{id}/pay:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      summary: Mark an open invoice as paid (requires write:invoices)
      responses:
        '200':
          description: The paid invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/invoices/{id}/void:
    parameters:
      - $ref: '#/components/parameters/InvoiceId'
    post:
      summary: Void an open invoice (requires void:invoices)
      responses:
        '200':
          description: The voided invoice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Invoice' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /v1/audit-events:
    get:
      summary: Audit trail of the caller's tenant (requires read:audit)
      responses:
        '200':
          description: Events, newest first
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [data]
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/AuditEvent' }
        '401': { $ref: '#/components/responses/Problem' }
        '403': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT (RS256, issuer https://idp.billing.test/, audience https://api.billing.test)

  parameters:
    InvoiceId:
      in: path
      name: id
      required: true
      schema: { type: string }
    ActAsTenant:
      in: header
      name: X-Act-As-Tenant
      description: Read-only impersonation of a tenant (requires impersonate:tenants). Every use is audited.
      schema: { type: string }

  responses:
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    InvoiceLine:
      type: object
      additionalProperties: false
      required: [description, quantity, unitPriceCents]
      properties:
        description: { type: string, minLength: 1, maxLength: 200 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        unitPriceCents: { type: integer, minimum: 0, maximum: 10000000 }

    Invoice:
      type: object
      additionalProperties: false
      required: [id, number, customer, currency, lines, taxRateBps, subtotalCents, taxCents, totalCents, status, createdBy, createdAt]
      properties:
        id: { type: string, pattern: '^inv_[0-9a-f]{16}$' }
        number: { type: string, pattern: '^INV-\d{4,}$' }
        customer: { type: string }
        currency: { type: string, enum: [USD] }
        lines:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/InvoiceLine' }
        taxRateBps: { type: integer, minimum: 0, maximum: 2500 }
        subtotalCents: { type: integer, minimum: 0 }
        taxCents: { type: integer, minimum: 0 }
        totalCents: { type: integer, minimum: 0 }
        status: { type: string, enum: [open, paid, void] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }

    InvoicePage:
      type: object
      additionalProperties: false
      required: [data, total, limit, offset]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invoice' }
        total: { type: integer, minimum: 0 }
        limit: { type: integer, minimum: 1, maximum: 100 }
        offset: { type: integer, minimum: 0 }

    InvoiceCreate:
      type: object
      additionalProperties: false
      required: [customer, lines]
      properties:
        customer: { type: string, minLength: 1, maxLength: 120 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/InvoiceLine' }
        taxRateBps: { type: integer, minimum: 0, maximum: 2500, default: 0 }

    InvoicePatch:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        customer: { type: string, minLength: 1, maxLength: 120 }
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/InvoiceLine' }
        taxRateBps: { type: integer, minimum: 0, maximum: 2500 }

    AuditEvent:
      type: object
      additionalProperties: false
      required: [id, at, tenant, actor, actorTenant, impersonated, action, resource]
      properties:
        id: { type: string, pattern: '^evt_[0-9a-f]{16}$' }
        at: { type: string, format: date-time }
        tenant: { type: string }
        actor: { type: string }
        actorTenant: { type: string }
        impersonated: { type: boolean }
        action: { type: string }
        resource: { type: string }

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [field, message]
            properties:
              field: { type: string }
              message: { type: string }
